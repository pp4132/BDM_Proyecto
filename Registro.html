<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Asegurado</title>

  <link rel="stylesheet" href="public/css/bootstrap.min.css">
  <link rel="stylesheet" href="styleInicioSesion.css">
</head>
<body>

<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-corporate-dark px-4">
    
    <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="Img/Logo.png" alt="Logo Empresa" height="100" class="me-2">
        <span class="fw-semibold">Sistema de Gestión de Siniestros</span>
    </a>

    <div class="ms-auto">
      <a href="index.html" class="btn btn-outline-light btn-sm me-2">
        Página Principal
      </a>
      <a href="InicioSesion.html" class="btn btn-light btn-sm">
        Iniciar Sesión
      </a>
    </div>

  </nav>
</header>

<main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-corporate">

  <section class="card corporate-card-register shadow-sm">

    <header class="card-header text-center bg-white border-0 pt-4">
      <h1 class="h4 fw-bold">Registro de Asegurado</h1>
      <p class="text-muted small mb-0">
        Complete la información solicitada
      </p>
    </header>

    <div class="card-body p-4">

      <form id="formRegistro" action="registro.php" method="POST" enctype="multipart/form-data">

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Apellidos</label>
            <input type="text" name="apellidos" class="form-control" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Alias</label>
          <input type="text" name="alias" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Fecha de Nacimiento</label>
          <input type="date" name="fecha_nacimiento" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Género</label>
          <select name="genero" class="form-select" required>
            <option value="">Seleccione</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input type="tel" name="telefono" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Correo Electrónico</label>
          <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required>
        </div>

        <div class="mb-4">
          <label class="form-label">Foto</label>
          <input type="file" name="foto" class="form-control" accept="image/*">
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-corporate fw-bold">
            Registrarse
          </button>
        </div>

      </form>

    </div>

    <footer class="card-footer text-center small text-muted bg-white border-0 pb-3">
      © 2026 Departamento de Siniestros
    </footer>

  </section>

</main>

<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
<div class="modal fade" id="modalMensaje" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Error</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="modalTexto">
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cerrar
        </button>
      </div>

    </div>
  </div>
</div>

<script src="public/js/bootstrap.bundle.min.js"></script>
<script src="NotificacionErrores.js"></script>

</body>
</html>
