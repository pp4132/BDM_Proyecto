<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar Siniestro</title>

  <link rel="stylesheet" href="public/css/bootstrap.min.css">
  <link rel="stylesheet" href="styleInicioSesion.css">
  <link rel="stylesheet" href="stylePanel.css">
    <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
 
</head>

<body>
<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-corporate-dark fixed-top px-4">
    <a class="navbar-brand d-flex align-items-center" href="Index.html">
      <img src="Img/Logo.png" alt="Logo Empresa" height="100" class="me-2">
      <span>Sistema de Gestión de Siniestros</span>
    </a>
    <div class="ms-auto">
      <a href="Index.html" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
    </div>
  </nav>
</header>

<!-- SIDEBAR -->
<div class="sidebar">
  <br><br>
  <div class="user-info">
    <img src="Img/usuario.png" alt="Usuario">
    <h6>Nombre completo</h6>
    <small>Asegurado</small>
  </div>

  <a href="PanelUsuario.html">Dashboard</a>
  <a href="Siniestros.html">Mis Siniestros</a>
  <a href="Busqueda.html">Buscar</a>
  <a href="CrearSiniestro.html" class="active">
    <i class="bi bi-plus-circle"></i> Crear Siniestro
  </a>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div class="content">
  <br><br>
  <h2 class="mb-4">Buscar Siniestro</h2>

  <!-- Barra de búsqueda -->
  <form id="searchForm" class="search-bar" method="GET" action="/buscar_siniestro">
    <input type="text" class="form-control" name="query" placeholder="Ingrese ID de siniestro o palabra clave" required>
    <button type="submit" class="btn btn-corporate">Buscar</button>
  </form>

  <!-- Resultados -->
  <div id="results">
    <!-- Ejemplo de tarjeta de resultado -->
    <!-- Esto se genera dinámicamente según la búsqueda -->
    
    <div class="card card-siniestro">
      <div class="card-body">
        <h5 class="card-title">Siniestro #1234</h5>
        <p><strong>Estado:</strong> En Proceso</p>
        <p><strong>Fecha:</strong> 15/02/2026</p>
        <a href="Siniestros.html" class="btn btn-outline-dark btn-sm">Ver Detalle</a>
      </div>
    </div>
    
    <p class="no-results">Ingrese un término de búsqueda para ver resultados.</p>
  </div>
</div>

<footer class="text-center">
  © 2026 Departamento de Siniestros
</footer>

<script src="public/js/bootstrap.bundle.min.js"></script>
</body>
</html>
